name: Update schedule.json

on:
  schedule:
    - cron: "*/5 * * * *"          # каждые 5 минут
  workflow_dispatch: {}             # ручной запуск из UI
  repository_dispatch:
    types: [sheets-edited]          # триггер из Apps Script onEdit
  push:
    branches: [main]
    paths:
      - "schedule_parser/**"
      - "schema/**"
      - ".github/workflows/schedule.yml"
      - "run.py"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Parse Sheets (auto-discovered) → public/schedule.json
        run: |
          mkdir -p public
          python run.py --discover --out public/schedule.json

      - name: Validate against JSON Schema
        run: |
          python -c "
          import json, pathlib, jsonschema
          schema = json.loads(pathlib.Path('schema/schedule.schema.json').read_text(encoding='utf-8'))
          data   = json.loads(pathlib.Path('public/schedule.json').read_text(encoding='utf-8'))
          jsonschema.validate(data, schema)
          print('OK, groups=%d lessons=%d' % (len(data['groups']), len(data['lessons'])))
          "

      - name: Copy schema next to JSON
        run: cp schema/schedule.schema.json public/schedule.schema.json

      - name: Commit JSON snapshot to repo (history)
        run: |
          git config user.name  "schedule-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/schedule.json
          git diff --cached --quiet || git commit -m "chore: refresh schedule.json"
          git push || echo "nothing to push"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
