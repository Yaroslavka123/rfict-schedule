<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --border: #dadce0;
      --primary: #1a73e8;
      --primary-hover: #1765cc;
      --muted: #5f6368;
      --bg-active: #e8f0fe;
      --danger: #c5221f;
      --danger-bg: #fce8e6;
    }
    * { box-sizing: border-box; }
    html, body {
      overflow-x: hidden;
      max-width: 100%;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 15px;
      padding: 14px;
      color: #202124;
      margin: 0;
    }
    h2 { font-size: 17px; font-weight: 600; margin: 0 0 6px 0; }
    .hint { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
    label {
      display: block;
      margin-top: 10px;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
    }
    input[type="text"], select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 15px;
      font-family: inherit;
      margin-top: 3px;
    }
    input:focus, select:focus { outline: none; border-color: var(--primary); }
    .types {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 4px;
      margin-top: 4px;
    }
    .type-btn {
      padding: 10px 8px;
      border: 2px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      user-select: none;
      transition: border-color 0.1s;
    }
    .type-btn.active { border-color: var(--primary); }
    .type-btn:hover { filter: brightness(0.96); }

    /* Subgroup blocks */
    .subgroup-block {
      border-left: 3px solid var(--primary);
      border-radius: 0 6px 6px 0;
      padding: 12px;
      margin-top: 10px;
      background: #f8f9fa;
      position: relative;
    }
    .subgroup-block.cancelled-block {
      border-left-color: var(--danger);
      background: #fef7f6;
    }
    .subgroup-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .subgroup-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--primary);
    }
    .subgroup-block.cancelled-block .subgroup-title { color: var(--danger); }
    .icon-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      padding: 0 4px;
    }
    .icon-btn:hover { color: #d93025; }
    .add-row-btn {
      background: none;
      border: 1px dashed var(--border);
      border-radius: 4px;
      padding: 10px;
      width: 100%;
      cursor: pointer;
      color: var(--muted);
      font-size: 14px;
      margin-top: 10px;
    }
    .add-row-btn:hover { color: var(--primary); border-color: var(--primary); }

    /* Inline date row */
    .date-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 2px;
    }
    .date-row input[type="text"] {
      flex: 1;
      padding: 6px 8px;
      font-size: 14px;
      margin: 0;
    }
    .date-row span {
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
    }

    /* Subgroup selector row */
    .sg-selector {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: 2px;
    }
    .sg-chip {
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 14px;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
      background: #fff;
      transition: all 0.15s;
    }
    .sg-chip.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .sg-chip:hover { border-color: var(--primary); }

    /* Cancel checkbox inside subgroup */
    .cancel-inline {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      font-size: 12px;
    }
    .cancel-inline label {
      margin: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--danger);
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
    }
    .cancel-inline input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--danger);
    }

    /* Single-block fields */
    .checkbox-row {
      display: flex;
      gap: 12px;
      margin-top: 4px;
    }
    .checkbox-row label {
      margin-top: 0;
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 400;
      color: #202124;
    }

    /* Actions */
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    button.primary {
      flex: 1;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 500;
    }
    button.primary:hover:not(:disabled) { background: var(--primary-hover); }
    button.primary:disabled { background: #ccc; cursor: not-allowed; }
    button.secondary {
      padding: 12px 14px;
      background: #fff;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      font-size: 15px;
    }
    button.secondary:hover { background: #f1f3f4; }
    .status {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 14px;
      display: none;
    }
    .status.ok { background: #e6f4ea; color: #137333; display: block; }
    .status.err { background: var(--danger-bg); color: var(--danger); display: block; }
    .cell-info {
      background: var(--bg-active);
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 10px;
      color: var(--muted);
    }
    .cell-info b { color: var(--primary); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <h2>Занятие</h2>
  <div class="hint">Выбери ячейку → заполни → «Применить» (Ctrl+Enter).</div>

  <div class="cell-info" id="cell-info">
    <span id="cell-loading">Читаю ячейку…</span>
    <span id="cell-addr" style="display:none"></span>
    <button type="button" class="icon-btn" id="refresh-cell" title="Перечитать ячейку" style="float:right;font-size:16px;display:none">↻</button>
  </div>

  <label>Тип занятия *</label>
  <div class="types" id="types"></div>

  <!-- Не-лаба: один предмет, один препод -->
  <div id="single-block">
    <label>Предмет *</label>
    <input type="text" id="subject" list="subjects-list" placeholder="Начни печатать..." />
    <datalist id="subjects-list"></datalist>

    <label>Преподаватель</label>
    <input type="text" id="teacher" list="teachers-list" placeholder="ст.пр. ИвановИ.И." />
    <datalist id="teachers-list"></datalist>

    <label>Аудитория</label>
    <input type="text" id="room" list="rooms-list" placeholder="117а" />
    <datalist id="rooms-list"></datalist>

    <label>Подгруппа</label>
    <div class="checkbox-row">
      <label><input type="checkbox" name="sg" value="1ПГ"> 1ПГ</label>
      <label><input type="checkbox" name="sg" value="2ПГ"> 2ПГ</label>
      <label><input type="checkbox" name="sg" value="3ПГ"> 3ПГ</label>
      <label><input type="checkbox" name="sg" value="4ПГ"> 4ПГ</label>
    </div>
    <select id="cycle">
      <option value="">каждую неделю</option>
      <option value="нечет">нечётные</option>
      <option value="чет">чётные</option>
    </select>

    <label>Период</label>
    <div class="date-row">
      <span>с</span>
      <input type="text" id="date-from" placeholder="03.03" />
      <span>по</span>
      <input type="text" id="date-to" placeholder="26.05" />
    </div>

    <label>Комментарий</label>
    <input type="text" id="comment" placeholder="дополнительная информация" />

    <div class="cancel-inline" style="margin-top:8px">
      <label><input type="checkbox" id="cancel-check"> ОТМЕНА</label>
    </div>
  </div>

  <!-- Лаба: сразу подгруппы -->
  <div id="multi-block" class="hidden">
    <div id="subgroup-list"></div>
    <button type="button" class="add-row-btn" id="add-subgroup">+ ещё подгруппа</button>
  </div>

  <div class="actions">
    <button class="primary" id="submit" disabled>Применить</button>
    <button class="secondary" id="next-cell" title="Применить и перейти вниз" disabled>↓ След.</button>
    <button class="secondary" id="clear" title="Очистить ячейку и форму">Очистить</button>
  </div>

  <div class="status" id="status"></div>

<script>
  const state = {
    types: [],
    lesson_type: null,
    cell: null,
  };

  function el(tag, attrs, ...children) {
    const e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(k => {
      if (k === 'class') e.className = attrs[k];
      else if (k === 'onclick') e.onclick = attrs[k];
      else if (k.startsWith('data-')) e.setAttribute(k, attrs[k]);
      else e[k] = attrs[k];
    });
    children.forEach(c => {
      if (c == null) return;
      e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return e;
  }

  function renderTypes() {
    const container = document.getElementById('types');
    container.innerHTML = '';
    state.types.forEach(t => {
      const btn = el('div', {class: 'type-btn', 'data-code': t.code});
      btn.style.background = t.color;
      btn.textContent = t.label;
      btn.onclick = () => selectType(t.code);
      container.appendChild(btn);
    });
  }

  function selectType(code) {
    state.lesson_type = code;
    document.querySelectorAll('.type-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.code === code);
    });
    const isLab = code === 'lab';
    document.getElementById('single-block').classList.toggle('hidden', isLab);
    document.getElementById('multi-block').classList.toggle('hidden', !isLab);
    if (isLab && document.querySelectorAll('.subgroup-block').length === 0) {
      addSubgroupRow();
    }
    validate();
    if (!isLab) setTimeout(() => document.getElementById('subject').focus(), 50);
  }

  // ─── Subgroup block for labs ─────────────────────────────────────────
  function addSubgroupRow(prefill) {
    const list = document.getElementById('subgroup-list');
    const idx = list.children.length;
    const block = el('div', {class: 'subgroup-block'});

    // Header
    const header = el('div', {class: 'subgroup-header'});
    const title = el('span', {class: 'subgroup-title'}, 'Подгруппа #' + (idx + 1));
    header.appendChild(title);
    const removeBtn = el('button', {type: 'button', class: 'icon-btn', onclick: () => { block.remove(); renumberSubgroups(); validate(); }}, '✕');
    header.appendChild(removeBtn);
    block.appendChild(header);

    // Subject
    const subjInput = el('input', {type: 'text', list: 'subjects-list', placeholder: 'Предмет *', 'class': 'sg-subject'});
    subjInput.value = (prefill && prefill.subject) || '';
    subjInput.oninput = validate;
    block.appendChild(el('label', null, 'Предмет'));
    block.appendChild(subjInput);

    // Subgroup selector: chips for NПГ
    block.appendChild(el('label', null, 'Подгруппа'));
    const sgRow = el('div', {class: 'sg-selector'});
    ['1ПГ', '2ПГ', '3ПГ', '4ПГ'].forEach(pg => {
      const chip = el('span', {class: 'sg-chip', 'data-pg': pg}, pg);
      chip.onclick = () => { chip.classList.toggle('active'); buildSubgroupText(block); validate(); };
      sgRow.appendChild(chip);
    });
    block.appendChild(sgRow);

    // Cycle select
    const cycleSelect = el('select', {class: 'sg-cycle'});
    [['', 'еженедельно'], ['нечет/чет', 'нечет/чет'], ['чет/нечет', 'чет/нечет'], ['нечет', 'нечет'], ['чет', 'чет']].forEach(([val, txt]) => {
      const opt = el('option', {value: val}, txt);
      cycleSelect.appendChild(opt);
    });
    cycleSelect.onchange = () => { buildSubgroupText(block); };
    block.appendChild(cycleSelect);

    // Hidden text field for the assembled subgroup text
    const sgText = el('input', {type: 'hidden', 'class': 'sg-name'});
    block.appendChild(sgText);

    // Teacher
    const teacherInput = el('input', {type: 'text', list: 'teachers-list', placeholder: 'доц. ИвановИ.И.', 'class': 'sg-teacher'});
    teacherInput.value = (prefill && prefill.teacher) || '';
    teacherInput.oninput = validate;
    block.appendChild(el('label', null, 'Преподаватель'));
    block.appendChild(teacherInput);

    // Room
    const roomInput = el('input', {type: 'text', list: 'rooms-list', placeholder: '703', 'class': 'sg-room'});
    roomInput.value = (prefill && prefill.room) || '';
    roomInput.oninput = validate;
    block.appendChild(el('label', null, 'Аудитория'));
    block.appendChild(roomInput);

    // Dates: с ... по ...
    block.appendChild(el('label', null, 'Период'));
    const dateRow = el('div', {class: 'date-row'});
    dateRow.appendChild(el('span', null, 'с'));
    const dfInput = el('input', {type: 'text', placeholder: '03.03', 'class': 'sg-date-from'});
    dfInput.value = (prefill && prefill.date_from) || '';
    dateRow.appendChild(dfInput);
    dateRow.appendChild(el('span', null, 'по'));
    const dtInput = el('input', {type: 'text', placeholder: '26.05', 'class': 'sg-date-to'});
    dtInput.value = (prefill && prefill.date_to) || '';
    dateRow.appendChild(dtInput);
    block.appendChild(dateRow);

    // Comment
    const commentInput = el('input', {type: 'text', placeholder: 'комментарий', 'class': 'sg-comment'});
    commentInput.value = (prefill && prefill.comment) || '';
    block.appendChild(el('label', null, 'Комментарий'));
    block.appendChild(commentInput);

    // Cancel
    const cancelRow = el('div', {class: 'cancel-inline'});
    const cancelLabel = el('label');
    const cancelCb = el('input', {type: 'checkbox', 'class': 'sg-cancel'});
    cancelCb.checked = (prefill && prefill.cancelled) || false;
    cancelCb.onchange = () => block.classList.toggle('cancelled-block', cancelCb.checked);
    cancelLabel.appendChild(cancelCb);
    cancelLabel.appendChild(document.createTextNode(' ОТМЕНА'));
    cancelRow.appendChild(cancelLabel);
    block.appendChild(cancelRow);

    list.appendChild(block);

    // Prefill subgroup chips if provided
    if (prefill && prefill.subgroup) {
      prefillSubgroupChips(block, prefill.subgroup);
    }

    validate();
    if (!prefill) setTimeout(() => subjInput.focus(), 50);
  }

  function renumberSubgroups() {
    document.querySelectorAll('.subgroup-block').forEach((block, i) => {
      const title = block.querySelector('.subgroup-title');
      if (title) title.textContent = 'Подгруппа #' + (i + 1);
    });
  }

  function buildSubgroupText(block) {
    const chips = [...block.querySelectorAll('.sg-chip.active')].map(c => c.dataset.pg);
    const cycle = block.querySelector('.sg-cycle').value;
    const hidden = block.querySelector('.sg-name');
    if (!chips.length) { hidden.value = ''; return; }
    let text = chips.join('/');
    if (cycle) text += ' ' + cycle;
    hidden.value = text;
  }

  function prefillSubgroupChips(block, subgroupStr) {
    // Parse "1ПГ/2ПГ нечет/чет" or "3ПГ чет" etc.
    const pgMatches = subgroupStr.match(/\d\s*ПГ/gi) || [];
    pgMatches.forEach(pg => {
      const num = pg.replace(/\s/g, '');
      const chip = block.querySelector('.sg-chip[data-pg="' + num + '"]');
      if (chip) chip.classList.add('active');
    });
    const cycleSelect = block.querySelector('.sg-cycle');
    if (/нечет\/чет|нечёт\/чёт/i.test(subgroupStr)) cycleSelect.value = 'нечет/чет';
    else if (/чет\/нечет|чёт\/нечёт/i.test(subgroupStr)) cycleSelect.value = 'чет/нечет';
    else if (/нечет|нечёт/i.test(subgroupStr)) cycleSelect.value = 'нечет';
    else if (/чет|чёт/i.test(subgroupStr)) cycleSelect.value = 'чет';
    buildSubgroupText(block);
  }

  // ─── Collect data ────────────────────────────────────────────────────
  function collectSubgroups() {
    return [...document.querySelectorAll('.subgroup-block')].map(block => {
      buildSubgroupText(block);
      return {
        subject: block.querySelector('.sg-subject').value.trim(),
        subgroup: block.querySelector('.sg-name').value.trim(),
        teacher: block.querySelector('.sg-teacher').value.trim(),
        room: block.querySelector('.sg-room').value.trim(),
        date_from: block.querySelector('.sg-date-from').value.trim(),
        date_to: block.querySelector('.sg-date-to').value.trim(),
        comment: block.querySelector('.sg-comment').value.trim(),
        cancelled: block.querySelector('.sg-cancel').checked,
      };
    }).filter(sg => sg.subgroup || sg.teacher || sg.room || sg.subject);
  }

  function collectSubgroupSingle() {
    const sgs = [...document.querySelectorAll('input[name="sg"]:checked')].map(c => c.value);
    const cycle = document.getElementById('cycle').value;
    if (!sgs.length) return cycle ? cycle : '';
    return sgs.join('/') + (cycle ? ' ' + cycle : '');
  }

  function buildDateNotes(dateFrom, dateTo) {
    if (dateFrom && dateTo) return 'с ' + dateFrom + ' по ' + dateTo;
    if (dateTo) return 'по ' + dateTo;
    if (dateFrom) return 'с ' + dateFrom;
    return '';
  }

  function collectData() {
    if (state.lesson_type === 'lab') {
      const subgroups = collectSubgroups();
      let subject = '';
      if (subgroups.length > 0) subject = subgroups[0].subject || '';
      // Add date notes as string for each subgroup
      subgroups.forEach(sg => {
        sg.notes = buildDateNotes(sg.date_from, sg.date_to);
      });
      return {
        lesson_type: state.lesson_type,
        subject: subject,
        teacher: '',
        room: '',
        subgroup: '',
        notes: '',
        cancelled: false,
        teachers_by_subgroup: subgroups,
      };
    }

    const dateFrom = document.getElementById('date-from').value.trim();
    const dateTo = document.getElementById('date-to').value.trim();
    return {
      lesson_type: state.lesson_type,
      subject: document.getElementById('subject').value.trim(),
      teacher: document.getElementById('teacher').value.trim(),
      room: document.getElementById('room').value.trim(),
      subgroup: collectSubgroupSingle(),
      notes: buildDateNotes(dateFrom, dateTo),
      comment: document.getElementById('comment').value.trim(),
      cancelled: document.getElementById('cancel-check').checked,
      teachers_by_subgroup: [],
    };
  }

  function validate() {
    let ok = false;
    if (state.lesson_type) {
      if (state.lesson_type === 'lab') {
        const subs = [...document.querySelectorAll('.sg-subject')].map(el => el.value.trim());
        ok = subs.length > 0 && subs.every(s => s);
      } else {
        ok = !!document.getElementById('subject').value.trim();
      }
    }
    document.getElementById('submit').disabled = !ok;
    document.getElementById('next-cell').disabled = !ok;
  }

  // ─── Dicts & cell info ───────────────────────────────────────────────
  function loadDicts(d) {
    fillList('subjects-list', d.subjects || []);
    fillList('teachers-list', d.teachers || []);
    fillList('rooms-list', d.rooms || []);
  }

  function fillList(id, items) {
    const dl = document.getElementById(id);
    dl.innerHTML = '';
    items.forEach(v => {
      const o = document.createElement('option');
      o.value = v;
      dl.appendChild(o);
    });
  }

  function loadCellInfo(info) {
    state.cell = info;
    state.types = info.types || [];
    renderTypes();

    document.getElementById('cell-loading').style.display = 'none';
    const addrEl = document.getElementById('cell-addr');
    const refreshBtn = document.getElementById('refresh-cell');

    if (info.error) {
      addrEl.innerHTML = info.error;
      addrEl.style.display = '';
      refreshBtn.style.display = '';
      return;
    }

    addrEl.innerHTML = 'Ячейка: <b>' + colLetter(info.col) + info.row + '</b> · «' + info.sheet + '»';
    addrEl.style.display = '';
    refreshBtn.style.display = '';

    const parsed = info.parsed || {};
    if (parsed.lesson_type) selectType(parsed.lesson_type);

    if (parsed.lesson_type === 'lab') {
      // Fill lab subgroups
      tryFillLabSubgroups(info);
    } else {
      // Single mode
      if (parsed.subject) document.getElementById('subject').value = parsed.subject;
      if (parsed.teacher) document.getElementById('teacher').value = parsed.teacher;
      if (info.roomValue) document.getElementById('room').value = info.roomValue.split('\n')[0];
      if (parsed.subgroup) prefillSubgroupSingle(parsed.subgroup);
      if (parsed.notes) parseDateFields(parsed.notes);
      if (parsed.cancelled) document.getElementById('cancel-check').checked = true;
    }

    validate();
  }

  function parseDateFields(notes) {
    // Parse "с 03.03 по 26.05" or "по 01.06" or "с 04.05"
    const mRange = notes.match(/с\s+(\d{1,2}\.\d{2})\s+по\s+(\d{1,2}\.\d{2})/);
    if (mRange) {
      document.getElementById('date-from').value = mRange[1];
      document.getElementById('date-to').value = mRange[2];
      return;
    }
    const mTo = notes.match(/по\s+(\d{1,2}\.\d{2})/);
    if (mTo) { document.getElementById('date-to').value = mTo[1]; return; }
    const mFrom = notes.match(/с\s+(\d{1,2}\.\d{2})/);
    if (mFrom) { document.getElementById('date-from').value = mFrom[1]; }
  }

  function prefillSubgroupSingle(sub) {
    const ck = (val) => {
      const cb = document.querySelector('input[name="sg"][value="' + val + '"]');
      if (cb) cb.checked = true;
    };
    if (/1ПГ/i.test(sub)) ck('1ПГ');
    if (/2ПГ/i.test(sub)) ck('2ПГ');
    if (/3ПГ/i.test(sub)) ck('3ПГ');
    if (/4ПГ/i.test(sub)) ck('4ПГ');
    const cycleSel = document.getElementById('cycle');
    if (/нечет|нечёт/i.test(sub)) cycleSel.value = 'нечет';
    else if (/чет|чёт/i.test(sub)) cycleSel.value = 'чет';
  }

  function tryFillLabSubgroups(info) {
    const parsed = info.parsed || {};
    if (parsed.lab_subgroups && parsed.lab_subgroups.length > 0) {
      document.getElementById('subgroup-list').innerHTML = '';
      const rooms = (info.roomValue || '').split('\n').map(s => s.trim()).filter(Boolean);
      parsed.lab_subgroups.forEach((sg, i) => {
        const dateInfo = parseDateStr(sg.notes || '');
        addSubgroupRow({
          subject: sg.subject || parsed.subject || '',
          subgroup: sg.subgroup || '',
          teacher: sg.teacher || '',
          room: rooms[i] || '',
          date_from: dateInfo.from,
          date_to: dateInfo.to,
          cancelled: sg.cancelled || false,
        });
      });
      return;
    }

    // Fallback: single-subject lab
    const rooms = (info.roomValue || '').split('\n').map(s => s.trim()).filter(Boolean);
    const lines = (info.value || '').split('\n').map(s => s.trim()).filter(Boolean);
    const teachers = lines.filter(l => /^(доц\.|проф\.|ст\.\s*пр\.|пр\.\s*ст\.|ст\.пр\.|пр\.|асс\.)/i.test(l));
    if (rooms.length <= 1 && teachers.length <= 1) {
      // Simple: one subgroup
      document.getElementById('subgroup-list').innerHTML = '';
      const dateInfo = parseDateStr(parsed.notes || '');
      addSubgroupRow({
        subject: parsed.subject || '',
        subgroup: parsed.subgroup || '',
        teacher: parsed.teacher || teachers[0] || '',
        room: rooms[0] || '',
        date_from: dateInfo.from,
        date_to: dateInfo.to,
        cancelled: parsed.cancelled || false,
      });
      return;
    }
    document.getElementById('subgroup-list').innerHTML = '';
    const subgroups = lines.filter(l => /\dПГ/i.test(l));
    const count = teachers.length;
    for (let i = 0; i < count; i++) {
      addSubgroupRow({
        subject: parsed.subject || '',
        subgroup: subgroups[i] || ['1ПГ', '2ПГ', '3ПГ', '4ПГ'][i] || '',
        teacher: teachers[i] || '',
        room: rooms[i] || '',
      });
    }
  }

  function parseDateStr(notes) {
    const result = { from: '', to: '' };
    if (!notes) return result;
    const mRange = notes.match(/с\s+(\d{1,2}\.\d{2})\s+по\s+(\d{1,2}\.\d{2})/);
    if (mRange) { result.from = mRange[1]; result.to = mRange[2]; return result; }
    const mTo = notes.match(/по\s+(\d{1,2}\.\d{2})/);
    if (mTo) { result.to = mTo[1]; return result; }
    const mFrom = notes.match(/с\s+(\d{1,2}\.\d{2})/);
    if (mFrom) { result.from = mFrom[1]; }
    return result;
  }

  function colLetter(col) {
    let s = '';
    while (col > 0) {
      const mod = (col - 1) % 26;
      s = String.fromCharCode(65 + mod) + s;
      col = Math.floor((col - 1) / 26);
    }
    return s;
  }

  function showStatus(msg, isError) {
    const s = document.getElementById('status');
    s.textContent = msg;
    s.className = 'status ' + (isError ? 'err' : 'ok');
    setTimeout(() => { s.className = 'status'; }, 4000);
  }

  function resetForm() {
    state.lesson_type = null;
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('subject').value = '';
    document.getElementById('teacher').value = '';
    document.getElementById('room').value = '';
    document.getElementById('date-from').value = '';
    document.getElementById('date-to').value = '';
    document.getElementById('comment').value = '';
    document.getElementById('cancel-check').checked = false;
    document.querySelectorAll('input[name="sg"]').forEach(c => c.checked = false);
    document.getElementById('cycle').value = '';
    document.getElementById('subgroup-list').innerHTML = '';
    document.getElementById('single-block').classList.remove('hidden');
    document.getElementById('multi-block').classList.add('hidden');
    document.getElementById('submit').disabled = true;
    document.getElementById('next-cell').disabled = true;
  }

  function refreshCellInfo() {
    document.getElementById('cell-loading').style.display = '';
    document.getElementById('cell-addr').style.display = 'none';
    google.script.run.withSuccessHandler(loadCellInfo)
      .withFailureHandler(err => {
        document.getElementById('cell-loading').textContent = 'Ошибка: ' + err.message;
      })
      .getActiveCellInfo();
  }

  function setSubmitEnabled(enabled) {
    document.getElementById('submit').disabled = !enabled;
    document.getElementById('next-cell').disabled = !enabled;
  }

  function submitForm(andMoveDown) {
    const data = collectData();
    setSubmitEnabled(false);
    const runner = google.script.run
      .withSuccessHandler(res => {
        setSubmitEnabled(true);
        showStatus(res.cell, false);
        if (andMoveDown) {
          resetForm();
          refreshCellInfo();
        }
      })
      .withFailureHandler(err => {
        setSubmitEnabled(true);
        showStatus('Ошибка: ' + err.message, true);
      });
    if (andMoveDown) {
      runner.applyLessonAndMoveDown(data);
    } else {
      runner.applyLesson(data);
    }
  }

  // ─── Event handlers ──────────────────────────────────────────────────
  document.getElementById('submit').onclick = () => submitForm(false);
  document.getElementById('next-cell').onclick = () => submitForm(true);

  document.getElementById('clear').onclick = () => {
    resetForm();
    showStatus('Форма очищена', false);
  };

  document.getElementById('refresh-cell').onclick = () => {
    resetForm();
    refreshCellInfo();
  };

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      if (!document.getElementById('submit').disabled) submitForm(false);
    }
  });

  document.getElementById('add-subgroup').onclick = () => addSubgroupRow();
  document.getElementById('subject').addEventListener('input', validate);

  // ─── Init: load dicts + cell info (no polling) ──────────────────────
  google.script.run.withSuccessHandler(loadDicts)
    .withFailureHandler(err => console.error('dict error:', err))
    .getDictionaries();
  google.script.run.withSuccessHandler(loadCellInfo)
    .withFailureHandler(err => {
      document.getElementById('cell-loading').textContent = 'Ошибка: ' + err.message;
    })
    .getActiveCellInfo();
</script>
</body>
</html>
